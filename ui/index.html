<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batter Up</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<script>
  // The old tab app moved to explore.html: a round-1/2 link (?view=p1|p2|more, or a &beat=) still opens it there.
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.has('page') && (q.has('view') || q.has('beat'))) location.replace('explore.html' + location.search + location.hash);
  })();
  // Health counters before anything else loads (story/app.js reads window.__hbHealth; the smoke test reads body data-*).
  window.__hbHealth = { errors: 0, messages: [], onchange: null };
  (function (h) {
    function bump(msg) { h.errors += 1; h.messages.push(String(msg)); if (h.onchange) h.onchange(); else if (document.body) document.body.dataset.errors = String(h.errors); }
    window.addEventListener('error', function (e) { bump(e && (e.message || e.error) || 'error'); });
    window.addEventListener('unhandledrejection', function (e) { bump(e && e.reason || 'unhandled rejection'); });
  })(window.__hbHealth);
</script>
<link rel="stylesheet" href="story/story.css">
<script src="vendor/deck-9.4.0.min.js"></script>
</head>
<body class="st" data-status="loading" data-webgl="none" data-errors="0" data-fixture="0" data-offsite="0">
<noscript>Batter Up needs JavaScript. The demo is static: serve the repo root and open /ui/.</noscript>
<script type="module" src="story/app.js"></script>
</body>
</html>
