<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px;display:flex;flex-direction:column;gap:6px;font-size:12px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{font-weight:700}.sw span{color:var(--muted);font-variant-numeric:tabular-nums}.tag{display:inline-flex;padding:1px 5px;border:1px solid var(--border-strong);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}</style></head><body><div style="font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1">One feeder, one hot evening</div><p style="font-size:14px;line-height:1.5;color:var(--ink-2);max-width:560px">About a thousand homes share this feeder (the line from the substation). Jargon goes in parentheses on first use.</p><div style="font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)">CHAPTER 1 · HEAT-WAVE EVENING</div></body></html>
