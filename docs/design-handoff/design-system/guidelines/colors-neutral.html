<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px;display:flex;flex-direction:column;gap:6px;font-size:12px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{font-weight:700}.sw span{color:var(--muted);font-variant-numeric:tabular-nums}.tag{display:inline-flex;padding:1px 5px;border:1px solid var(--border-strong);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--ink)"></i><b>Ink</b><span>--ink · #10231a</span></div><div class="sw"><i style="background:var(--muted)"></i><b>Muted</b><span>--muted · #5f6b63</span></div><div class="sw"><i style="background:var(--bg)"></i><b>Page</b><span>--bg · #f7f4ec</span></div><div class="sw"><i style="background:var(--panel)"></i><b>Panel</b><span>--panel · #fffdf8</span></div><div class="sw"><i style="background:var(--border)"></i><b>Border</b><span>--border · #e3dfd3</span></div></div></body></html>
