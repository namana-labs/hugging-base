<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px;display:flex;flex-direction:column;gap:6px;font-size:12px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{font-weight:700}.sw span{color:var(--muted);font-variant-numeric:tabular-nums}.tag{display:inline-flex;padding:1px 5px;border:1px solid var(--border-strong);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}</style></head><body><div style="height:56px;border-radius:8px;background:linear-gradient(90deg,var(--sky-night) 0%,var(--sky-night) 22%,var(--sky-day) 30%,var(--sky-day) 76%,var(--sky-night) 86%)"></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></body></html>
