<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px;display:flex;flex-direction:column;gap:6px;font-size:12px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{font-weight:700}.sw span{color:var(--muted);font-variant-numeric:tabular-nums}.tag{display:inline-flex;padding:1px 5px;border:1px solid var(--border-strong);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--healthy)"></i><b>Inside limits</b><span>--healthy · #8aa58f</span></div><div class="sw"><i style="background:var(--tier-1)"></i><b>Over nameplate</b><span>--tier-1 · #c7962b</span></div><div class="sw"><i style="background:var(--tier-2)"></i><b>Above normal, sustained</b><span>--tier-2 · #b23a2f</span></div><div class="sw"><i style="background:var(--tier-3)"></i><b>Above emergency</b><span>--tier-3 · #6e1d17</span></div><div class="sw"><i style="background:var(--quarantine)"></i><b>Quarantine / comms lost</b><span>--quarantine · #4a4f4c</span></div></div></body></html>
