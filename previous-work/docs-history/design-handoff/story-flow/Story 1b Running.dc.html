<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Hugging Base · Running</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#e6e2d7;color:#10231a;font-family:'Hanken Grotesk',system-ui,sans-serif}*{box-sizing:border-box}a{color:#1e4d2b}a:hover{color:#2a6a3b}@keyframes hbspin{to{transform:rotate(360deg)}}@keyframes hbpulse{0%,100%{opacity:.35}50%{opacity:1}}</style>
</helmet>
<section style="padding:48px 56px 64px;display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
    <span style="font:600 11px ui-monospace,Menlo,monospace;padding:3px 7px;background:#10231a;color:#fff;border-radius:4px">STEP 1 → 2</span>
    <span style="font-size:18px;font-weight:700">Running</span>
    <span style="font-size:14px;color:#5f6b63">Shown after Go while the simulator runs. Advances to <a href="Story%202%20Watch.dc.html">Step 2 · Run</a> when the run finishes.</span>
  </div>
  <div data-screen-label="1b Running" style="width:1600px;height:900px;background:#f7f4ec;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.08)">
    <div style="height:60px;flex:none;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #e3dfd3">
      <div style="flex:none;white-space:nowrap;font-weight:700;font-size:21px;letter-spacing:-0.02em;color:#1e4d2b">Hugging Base</div>
      <nav style="flex:none;white-space:nowrap;display:flex;gap:2px;padding:3px;border:1px solid #e3dfd3;border-radius:8px;font-size:13px">
        <a href="Story%201%20Levers.dc.html" style="padding:5px 10px;border-radius:6px;color:#10231a;text-decoration:none">1 Configure</a>
        <span style="padding:5px 10px;border-radius:6px;background:#e4efe6;color:#1e4d2b;font-weight:700">2 Run</span>
        <span style="padding:5px 10px;border-radius:6px;color:#9aa39c">3 Results</span>
        <span style="padding:5px 10px;border-radius:6px;color:#9aa39c">4 Learnings</span>
      </nav>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
      <div style="width:72px;height:72px;border-radius:50%;border:5px solid #e3dfd3;border-top-color:#1e4d2b;animation:hbspin 0.9s linear infinite"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="font-size:28px;font-weight:700;letter-spacing:-0.01em">{{ title }}</div>
        <div style="font-size:14px;color:#5f6b63;animation:hbpulse 1.6s ease-in-out infinite">{{ stage }}</div>
      </div>
      <sc-if value="{{ failed }}" hint-placeholder-val="{{ false }}"><a href="Story%201%20Levers.dc.html" style="font-size:14px;font-weight:700">← Back to Configure</a></sc-if>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { r: null };
  async componentDidMount() {
    const S = await import(new URL('ui/story.js', document.baseURI).href);
    S.startRun(S.getLevers(), (r) => {
      this.setState({ r });
      if (r.status === 'done') this.t = setTimeout(() => { location.href = 'Story%202%20Watch.dc.html'; }, 500);
    });
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const r = this.state.r, failed = !!(r && r.status === 'failed');
    return {
      failed,
      title: failed ? 'The run didn’t finish' : r && r.status === 'done' ? 'Done' : 'Running the simulation',
      stage: failed ? r.stage : r && r.status === 'done' ? 'Opening the run' : 'Solving the evening, 16:00 → 04:00',
    };
  }
}
</script>
</body>
</html>
