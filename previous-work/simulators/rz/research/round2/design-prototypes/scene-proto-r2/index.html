<html lang="en"><head><meta charset="utf-8"><title>R2 scene prototype</title>

</head>
<body data-status="loading" data-webgl="pending" data-errors="0" data-fixture="0" data-offsite="0">
<div id="scene"></div><div id="legend"></div><div id="stat"></div>
<script type="module">
import { svg, buildAtlas, batteryId, meterId, TIER_RGB, drawIcon } from './icons.js';
import { cameraPreset } from './ui/lib/scene-model.js';
const T0 = performance.now();
const q = new URLSearchParams(location.search);
const branch = q.get('branch') || 'naive', tq = q.get('t') || '22:30', cam = q.get('cam') || 'street', two = q.get('two') === '1';
const J = (p) => fetch(p).then((r) => r.json());
const [topo, fp, meta, doc, mnt] = await Promise.all([J('ui/data/topology.json'), J('ui/data/footprints.json'), J('ui/data/p1/meta.json'), J(`ui/data/p1/${branch}.json`), J('mount.json')]);
const T1 = performance.now();
const [hh, mm] = tq.split(':').map(Number);
const k = Math.max(0, Math.min(meta.steps - 1, (((hh * 60 + mm) - 16 * 60) + 1440) % 1440));
const tier = Array.from(doc.tier[k], Number), pct = doc.loading[k].map((x) => x / 10);
const soc = doc.soc[k].map((x) => x / 1000), state = doc.state[k], batKW = doc.batKW[k].map((x) => x / 10);

// ---- local metres ----
const M = 6371008.8 * Math.PI / 180;
const toM = (p, o) => [(p[0] - o[0]) * M * Math.cos(o[1] * Math.PI / 180), (p[1] - o[1]) * M];
const toLL = (m, o, z = 0) => [o[0] + m[0] / (M * Math.cos(o[1] * Math.PI / 180)), o[1] + m[1] / M, z];
const hash = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; };
function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const x of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], x) <= 0) lo.pop(); lo.push(x); }
  for (const x of p.reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], x) <= 0) up.pop(); up.push(x); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
/** min-area oriented box: {c:[x,y], u:[ux,uy] (long axis), L, W} */
function obb(pts) {
  const h = hull(pts); let best = null;
  for (let i = 0; i < h.length; i++) {
    const a = h[i], b = h[(i + 1) % h.length], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), c = Math.cos(ang), s = Math.sin(ang);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of h) { const x = p[0] * c + p[1] * s, y = -p[0] * s + p[1] * c; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const ar = (x1 - x0) * (y1 - y0);
    if (!best || ar < best.ar) best = { ar, c, s, x0, x1, y0, y1 };
  }
  let { c, s, x0, x1, y0, y1 } = best;
  let u = [c, s], L = x1 - x0, W = y1 - y0;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, C = [cx * c - cy * s, cx * s + cy * c];
  if (W > L) { u = [-s, c]; [L, W] = [W, L]; }
  return { c: C, u, L, W };
}
const WALL = [[226, 214, 190], [205, 186, 160], [214, 208, 192], [181, 116, 92], [188, 196, 176], [176, 188, 196], [232, 226, 212]];
const ROOF = [[74, 76, 80], [104, 88, 74], [96, 104, 114], [120, 112, 102], [86, 80, 76], [132, 126, 118]];   // neutrals only: red/amber/green belong to the tiers
const SUN = (() => { const v = [-0.45, -0.55, 0.7]; const n = Math.hypot(...v); return v.map((x) => x / n); })();
const shade = (col, n) => { const f = 0.62 + 0.5 * Math.max(0, n[0] * SUN[0] + n[1] * SUN[1] + n[2] * SUN[2]); return [Math.min(255, col[0] * f) | 0, Math.min(255, col[1] * f) | 0, Math.min(255, col[2] * f) | 0, 255]; };
function tri(a, b, c) { const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]]; let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]; const l = Math.hypot(...n) || 1; n = n.map((x) => x / l); if (n[2] < 0) n = n.map((x) => -x); return n; }
/** Hip roof over the real footprint: every eave vertex joins its clamped projection on the ridge (the OBB's long axis). */
function roofFaces(ring, o, wallH, home) {
  const P = ring.map((p) => toM(p, o));
  if (P.length > 3 && Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) < 0.01) P.pop();

  const R = P.map((p) => { const t = Math.max(-h, Math.min(h, (p[0] - b.c[0]) * b.u[0] + (p[1] - b.c[1]) * b.u[1])); return [b.c[0] + b.u[0] * t, b.c[1] + b.u[1] * t]; });

    const j = (i + 1) % P.length;
    const a = [...P[i], wallH], bb = [...P[j], wallH], rj = [...R[j], wallH + rise], ri = [...R[i], wallH + rise];

// ---- static scene ----
const tfs = topo.transformers, homes = topo.homes, fleet = topo.fleet || [], mount = mnt.mount;

  const ring = fp.homes[h.id] && fp.homes[h.id].length >= 3 ? fp.homes[h.id] : sq(h.lonlat);
  const o = ring.reduce((s, p) => [s[0] + p[0] / ring.length, s[1] + p[1] / ring.length], [0, 0]);

    const out = [best.X[0], best.X[1]], n = Math.hypot(out[0], out[1]) || 1;
    // step 1.3 m out from the wall, beside the meter (towards the transformer), then 3 m along the wall
    const cM = [best.X[0] + out[0] / n * 1.3 + best.u[0] * 3, best.X[1] + out[1] / n * 1.3 + best.u[1] * 3];
    cabinets.push({ j, home: i, polygon: box(cM, best.u, 2.2, 1.1, o), height: 2.4 });
    caps.push({ j, polygon: box(cM, best.u, 2.3, 1.2, o, 2.4), height: 0.3, state: state[j] });
    batIcons.push({ j, home: i, position: toLL(cM, o, 2.9), icon: batteryId(state[j], soc[j]), state: state[j], soc: soc[j], kw: batKW[j] });

const ctx = (fp.others || []).filter((r) => r && r.length >= 3).map((polygon, n) => ({ polygon, height: 3.3 }));
const ctxRoofs = [];
if (q.get('ctxroof') === '1') ctx.forEach((c, n) => { const o = c.polygon.reduce((s, p) => [s[0] + p[0] / c.polygon.length, s[1] + p[1] / c.polygon.length], [0, 0]); for (const f of roofFaces(c.polygon, o, 3.3, { id: 'c' + n, i: -1, tf: -1 }).faces) { f.color = [f.color[0] * 0.5 + 110, f.color[1] * 0.5 + 112, f.color[2] * 0.5 + 108, 255]; ctxRoofs.push(f); } });
const pads = [], plinths = [], poles = [], cans = [], halos = [], meters = [], labels = [];
const focusKey = new Map((topo.focus || []).map((f) => [f.tf, f.key]));
for (const b of topo.bridge || []) focusKey.set(b.tf, 'T-240');
let worst = 0; pct.forEach((p, i) => { if (p > pct[worst]) worst = i; });
tfs.forEach((t, i) => {
  const o = t.lonlat, code = tier[i];
  if (mount[i] === 'pole') {
    poles.push({ i, position: [o[0], o[1], 0] });
    cans.push({ i, position: toLL([1.0, 0], o, 6.8) });
  } else {
    plinths.push({ i, polygon: box([0, 0], [1, 0], 4.0, 3.4, o), height: 0.25 });
    pads.push({ i, polygon: box([0, 0], [1, 0], 3.6, 3.0, o, 0.25), height: 2.4 });
  }
  if (code >= 1) halos.push({ i, position: o, code });
  const named = focusKey.has(i);
  meters.push({ i, position: [o[0], o[1], mount[i] === 'pole' ? 11 : 3.2], icon: meterId(code, pct[i]), named, code, pct: pct[i] });
  if (named) labels.push({ i, position: [o[0], o[1], mount[i] === 'pole' ? 11 : 3.2], text: focusKey.get(i), code });
});
const worstLabel = [{ position: meters[worst].position, text: `worst now ${pct[worst].toFixed(1)}%`, code: tier[worst] }];
const T2 = performance.now();

// ---- legend (DOM, the same icons) ----
document.getElementById('legend').innerHTML = `
  <div class="row">${svg('house', { size: 20 })}<span>home <span class="sub">(real OSM footprint)</span></span></div>
  <div class="row"><span style="color:#44664a">${svg('padmount', { size: 20 })}</span><span>transformer, pad-mount</span></div>
  <div class="row"><span style="color:#5f6a70">${svg('polemount', { size: 20 })}</span><span>transformer, on a pole</span></div>
  <div class="row">${svg('meter', { size: 22, pct: 70, tier: 0 })}${svg('meter', { size: 22, pct: 130, tier: 3 })}<span>its load: the box is its limit;<br>spilling over the lid = overloaded</span></div>
  <div class="row"><span style="color:#0B6B6F">${svg('cabinet', { size: 20 })}</span><span>home battery, beside the house</span></div>
  <div class="row">${svg('battery', { size: 22, level: 0.8, state: 'C' })}${svg('battery', { size: 22, level: 0.5, state: 'D' })}${svg('battery', { size: 22, level: 0.3, state: 'I' })}<span>charge level: charging · giving · idle</span></div>
  <div class="sub">objects not to scale · hover anything</div>`;

// ---- tooltips ----

const key = (i) => focusKey.get(i) || `T-${i}`;

  let html = '';

    const h = homes[object.i ?? object.home];
    html = `<b>${svg('house', { size: 16 })} ${h.label}</b><br>on transformer ${key(h.tf)} (${TN[tier[h.tf]]})${fleetIdx.has(h.i ?? object.i ?? object.home) ? '<br>has a home battery' : ''}`;
  } else if (id === 'pads' || id === 'cans' || id === 'poles' || id === 'meters' || id === 'plinths') {
    const i = object.i, t = tfs[i];
    html = `<b>Transformer ${key(i)}</b> · ${t.kva} kVA, ${mount[i] === 'pole' ? 'on a pole' : 'pad-mount'}<br>${svg('meter', { size: 18, pct: pct[i], tier: tier[i] })} now at <b>${pct[i].toFixed(1)}%</b> of its limit: ${TN[tier[i]]}<br>serves ${t.homes.length} homes`;

// ---- deck ----

  const mx = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z, my = (lat, z) => { const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z; };

  g.lineWidth = 1 * dpr; g.strokeStyle = 'rgba(85,98,90,0.45)'; for (const e of topo.edges) { const a = P([e[0], e[1]]), b = P([e[2], e[3]]); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }

  for (const d of drops) { g.strokeStyle = d.code ? rgba(trgb(d.code, 235)) : 'rgba(70,80,74,0.45)'; g.lineWidth = (d.code >= 2 ? 3.5 : d.code ? 2.5 : 1.2) * dpr; const a = P(d.path[0]), b = P(d.path[1]); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }
  for (const f of roofs) { const rc = roofColor(f); g.fillStyle = rgba(rc); poly(f.poly); g.fill(); g.strokeStyle = rgba(rc); g.lineWidth = 0.6 * dpr; g.stroke(); }
  for (const p of plinths) { g.fillStyle = 'rgb(184,184,178)'; poly(p.polygon); g.fill(); }
  for (const p of pads) { g.fillStyle = 'rgb(62,98,68)'; poly(p.polygon); g.fill(); }
  for (const p of poles) { const a = P(p.position); g.fillStyle = 'rgb(118,98,78)'; g.beginPath(); g.arc(a[0], a[1], 3 * dpr, 0, 7); g.fill(); }
  for (const p of cans) { const a = P(p.position); g.fillStyle = 'rgb(150,158,162)'; g.beginPath(); g.arc(a[0], a[1], 4 * dpr, 0, 7); g.fill(); }
  for (const c of cabinets) { g.fillStyle = 'rgb(240,242,238)'; poly(c.polygon); g.fill(); g.strokeStyle = 'rgb(11,107,111)'; g.lineWidth = 1.5 * dpr; g.stroke(); }
  const icon = (id, pos, size) => { const m = atlas.mapping[id], a = P(pos); g.drawImage(atlas.canvas, m.x, m.y, m.width, m.height, a[0] - size * dpr / 2, a[1] - size * dpr, size * dpr, size * dpr); };
  const near = v.zoom >= 16.2;
  for (const m of meters) if (m.named || m.code >= 1) icon(m.icon, m.position, near ? 44 : 30);
  for (const b of batIcons) icon(b.icon, b.position, near ? 34 : 22);
  g.font = `800 ${15 * dpr}px Inter, Helvetica, Arial, sans-serif`;
  for (const l of labels) { const a = P(l.position); const w = g.measureText(l.text).width; g.fillStyle = 'rgba(247,249,245,0.92)'; g.fillRect(a[0] + 18 * dpr, a[1] - 44 * dpr, w + 10 * dpr, 20 * dpr); g.fillStyle = '#101613'; g.fillText(l.text, a[0] + 23 * dpr, a[1] - 29 * dpr); }
  for (const l of worstLabel) { const a = P(l.position); const w = g.measureText(l.text).width; g.fillStyle = rgba(trgb(l.code, 245)); g.fillRect(a[0] - w / 2 - 6 * dpr, a[1] - 80 * dpr, w + 12 * dpr, 21 * dpr); g.fillStyle = '#fff'; g.fillText(l.text, a[0] - w / 2, a[1] - 64 * dpr); }
  document.body.dataset.webgl = 'fallback';
  requestAnimationFrame(() => done('2d'));
}
