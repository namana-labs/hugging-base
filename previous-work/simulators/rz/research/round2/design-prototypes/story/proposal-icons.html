<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ink:#101613;--muted:#55625A;--accent:#0B6B6F;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--open:#6b6f6c;--paper:#F7F9F5;--bg:#E9EDE7;--rule:#CAD3CA;
--tf-green:#3f6b4a;--bat:#1d5f8c;--house:#b9774e}
body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);margin:16px}
.row{display:flex;gap:18px;align-items:flex-end;margin:10px 0;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:4px;width:84px;text-align:center}
.ico{width:40px;height:40px;display:block}
.big .ico{width:64px;height:64px}
.chain{display:flex;align-items:center;gap:8px;background:rgba(247,249,245,.94);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;width:max-content;box-shadow:0 4px 18px rgba(16,22,19,.12)}
.step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:600}
.step .ico{width:30px;height:30px}
.step.off{opacity:.32;border:1px dashed var(--muted)}
.step.on{background:#fff;border:1px solid var(--rule)}
.step.bad{background:color-mix(in srgb,var(--crit) 14%,#fff);color:var(--crit);border:1px solid var(--crit)}
.step small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.arrow{color:var(--muted);font-size:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;vertical-align:2px}
.cap{position:relative;max-width:620px;background:rgba(16,22,19,.86);color:#fff;border-radius:10px;padding:10px 14px 10px 12px;display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.3}
.cap .ico{width:34px;height:34px;flex:none}
.cap time{font-variant-numeric:tabular-nums;font-weight:700;color:#9fe0da;margin-right:6px}
.tfrow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;width:400px;padding:6px 8px;border-left:4px solid var(--crit);background:#fff;border-radius:6px}
.tfrow .ico{width:36px;height:36px}
.tfrow .pct{font-size:22px;font-weight:700;color:var(--crit)}
.tfrow .bats{display:flex;gap:2px}.tfrow .bats .ico{width:22px;height:22px}
.tfrow .name{font-weight:700;font-size:14px}
.tfrow .name small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
</style></head><body>
<div id="out"></div>
<script type="module">
const I = {
 house: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M3 11.2 12 3.8l9 7.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M5.6 9.6v10.4h12.8V9.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10.2 20v-5h3.6v5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`,
 bat: (soc=0.6, glyph='') => { const h=13.6*Math.max(0,Math.min(1,soc)), y=19.4-h; const badge = glyph ? `<circle cx="18.2" cy="18.4" r="4.6" fill="currentColor" stroke="var(--paper,#fff)" stroke-width="1.4"/>${glyph==='C'?'<path d="M18.9 15.4 16.9 18.7h2.4l-1.3 2.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>':glyph==='D'?'<path d="M18.2 21V16M16.3 17.8l1.9-1.9 1.9 1.9" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>':'<path d="M18.2 15.9v2.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="18.2" cy="20.6" r=".95" fill="#fff"/>'}` : ''; return `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4.4" y="3.6" width="12" height="18" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="1.6" width="4.8" height="2.2" rx=".7" fill="currentColor"/><rect x="6.6" y="${y.toFixed(2)}" width="7.6" height="${h.toFixed(2)}" rx=".8" fill="currentColor" opacity=".85"/><path d="M5.6 16.7h1.2M14 16.7h1.2" stroke="currentColor" stroke-width="1"/>${badge}</svg>`; },
 tf: (pct=60) => { const f=Math.max(0,Math.min(pct,100))/100, h=10.2*f, y=19.1-h, over=pct>100, oh=Math.min(5.4,5.4*(pct-100)/100); return `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M8 7.8V5M12 7.8V3.8M16 7.8V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="${y.toFixed(2)}" width="14" height="${h.toFixed(2)}" rx=".6" fill="currentColor" opacity=".32"/>${over?`<rect x="5" y="${(7.8-oh).toFixed(2)}" width="14" height="${(oh+1.4).toFixed(2)}" rx="1" fill="currentColor"/>`:''}<rect x="3.6" y="7.8" width="16.8" height="12.6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.9 11.2 10.7 14.4h2.4l-1.8 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; },
 pole: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M9 2.5v19M4 5.5h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 9.5h2.4" stroke="currentColor" stroke-width="1.6"/><rect x="11.4" y="7" width="8" height="10.4" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.4 4.6v2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
 price: (dir='') => `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M3.4 11.8V4.4a1 1 0 0 1 1-1h7.4l8.1 8.1a1.4 1.4 0 0 1 0 2l-6.4 6.4a1.4 1.4 0 0 1-2 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.8" cy="7.8" r="1.5" fill="currentColor"/>${dir==='down'?'<path d="M14.6 9.2v6.2M12.3 13.1l2.3 2.3 2.3-2.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>':dir==='up'?'<path d="M14.6 15.4V9.2M12.3 11.5l2.3-2.3 2.3 2.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`,
 money: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14.9 8.9c-.5-1-1.6-1.6-2.9-1.6-1.6 0-2.8.9-2.8 2.2 0 3 5.8 1.6 5.8 4.6 0 1.3-1.3 2.3-3 2.3-1.4 0-2.6-.7-3-1.8M12 5.6v1.7M12 16.4v2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`,
 warn: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3.4 21.6 20.2H2.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.4v5.1" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.25" fill="currentColor"/></svg>`,
 check: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.8 12.3l2.8 2.8 5.6-5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 turns: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M19.5 9.5A8 8 0 0 0 5.2 7.4M4.5 14.5a8 8 0 0 0 14.3 2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.6 3.8v3.9h3.9M19.4 20.2v-3.9h-3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 nosignal: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 9.6a11.5 11.5 0 0 1 16 0M7 12.8a7.2 7.2 0 0 1 10 0M10 16a3 3 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>`,
 ev: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 15.5l1.6-4.8a2 2 0 0 1 1.9-1.4h9a2 2 0 0 1 1.9 1.4l1.6 4.8v3H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="18.5" r="1.4" fill="currentColor"/><circle cx="16.5" cy="18.5" r="1.4" fill="currentColor"/><path d="M12.8 2.8 10.9 5.9h2.2L11.4 8.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 pause: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.7 8.4v7.2M14.3 8.4v7.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>`,
 fuse: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M2.5 12h5M16.5 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="7.5" y="8.5" width="9" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 13.8l2-3.6 1 1.6 2-2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
 bolt: `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M13.5 2.8 6.5 13.4h5l-1.6 7.8 7.6-11h-5.2z" fill="currentColor"/></svg>`,
};
window.I = I;
const col = (c, s) => `<span style="color:var(${c})">${s}</span>`;
const cell = (s, t) => `<div class="cell">${s}<span>${t}</span></div>`;
let h = '<div class="row big">' + [
  cell(col('--house', I.house), 'house'), cell(col('--bat', I.bat(.62)), 'battery 62%'), cell(col('--tf-green', I.tf(60)), 'transformer 60%'),
  cell(col('--tf-green', I.pole), 'pole can'), cell(col('--ink', I.price()), 'price'), cell(col('--ink', I.money), 'money'), cell(col('--crit', I.warn), 'warning'),
].join('') + '</div>';
h += '<div class="row">' + [0.05,0.2,0.4,0.7,1].map(s => cell(col('--bat', I.bat(s)), `soc ${Math.round(s*100)}%`)).join('') +
  cell(col('--accent', I.bat(.35,'C')), 'charging') + cell(col('--serious', I.bat(.7,'D')), 'selling') + cell(col('--muted', I.bat(.5,'X')), 'silent') + '</div>';
h += '<div class="row">' + [[40,'--good'],[95,'--good'],[105,'--warn'],[125,'--serious'],[160,'--crit'],[201,'--crit']].map(([p,c]) => cell(col(c, I.tf(p)), `tf ${p}%`)).join('') + '</div>';
h += '<div class="row">' + [['price','down','--accent'],['price','up','--crit']].map(([n,d,c]) => cell(col(c, I.price(d)), 'price '+d)).join('') +
  [['check','--good'],['turns','--accent'],['nosignal','--muted'],['ev','--serious'],['pause','--muted'],['fuse','--open'],['bolt','--accent']].map(([n,c]) => cell(col(c, I[n]), n)).join('') + '</div>';
h += `<div class="row"><div class="chain">
 <div class="step on">${col('--accent', I.price('down'))}<span>Price drops<small>$566 → $55 /MWh</small></span></div><span class="arrow">→</span>
 <div class="step on">${col('--accent', I.bat(.3,'C'))}<span>All 96 charge at once<small>22:00</small></span></div><span class="arrow">→</span>
 <div class="step bad">${I.tf(201)}<span>Transformers overload<small>3 past emergency</small></span></div></div></div>`;
h += `<div class="row"><div class="chain">
 <div class="step on">${col('--accent', I.price('down'))}<span>Price drops<small>$566 → $55 /MWh</small></span></div><span class="arrow">→</span>
 <div class="step on">${col('--good', I.check)}<span>Room checked first<small>30 of 96 may charge</small></span></div><span class="arrow">→</span>
 <div class="step off">${col('--accent', I.turns)}<span>Batteries take turns<small>0 battery-caused overloads</small></span></div></div></div>`;
h += `<div class="row"><div class="cap">${col('--crit', I.warn).replace('var(--crit)','#ff8a7a')}<div><time>22:00</time>Every battery on the street starts charging in the same minute. Transformer A goes to 197%, about twice what it is rated for.<span class="dot" style="background:#9aa6a0" title="SIM"></span></div></div></div>`;
h += `<div class="row"><div class="tfrow">${col('--crit', I.tf(201))}<div class="name">A <small>25 kVA · 2 homes</small></div><div style="display:flex;gap:10px;align-items:center"><div class="bats">${col('--accent', I.bat(.47,'C'))}${col('--accent', I.bat(.45,'C'))}</div><span class="pct">201%</span></div></div></div>`;
document.getElementById('out').innerHTML = h;
</script></body></html>
