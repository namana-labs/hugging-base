[project]
name = "hugging-base"
version = "0.0.1"
description = "Feeder-aware simulator for a fleet of home batteries (Base Power & AITX hackathon, Sep 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "OpenDSSDirect.py==0.9.4",
    "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]

[tool.uv]
package = false
